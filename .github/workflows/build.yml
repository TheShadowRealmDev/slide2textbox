name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: Android64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unlimited-sliders
          path: ${{ steps.build.outputs.build-output }}
